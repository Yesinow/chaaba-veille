name: Veille oued Chaaba

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcul du niveau de vigilance
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Enregistrer status.json
        run: |
          git config user.name "chaaba-veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git commit -m "veille: mise a jour" || echo "rien a enregistrer"
          git push

      - name: Ouvrir une alerte (issue)
        if: steps.run.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.run.outputs.title }}" --body-file alert.md
