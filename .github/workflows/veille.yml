name: Veille oued Chaaba

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut retarder)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Etat prive des notifications (jamais publie dans le depot)
      - uses: actions/cache@v4
        with:
          path: .state
          key: notify-${{ github.run_id }}
          restore-keys: notify-

      - name: Mesures, previsions et notification privee
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Enregistrer status.json
        if: always()
        run: |
          git config user.name "chaaba-veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git commit -m "veille: mise a jour" || echo "rien a enregistrer"
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
