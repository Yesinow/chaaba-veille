name: Sonde carte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonder
        run: python3 tools/sonde_carte.py > sonde.txt 2>&1 || true
      - name: Enregistrer
        run: |
          git config user.name "chaaba-veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sonde.txt osm_eau.json || true
          git commit -m "sonde: carte" || true
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
