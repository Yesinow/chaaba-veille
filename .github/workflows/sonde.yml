name: Sonde sources temps reel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester les sources
        run: python3 sonde.py > sonde.txt 2>&1 || true
      - name: Enregistrer
        run: |
          git config user.name "chaaba-veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sonde.txt legende-h40b.png
          git commit -m "sonde: resultats" || true
          git pull --rebase -q && git push
